[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Julien Bombled"]
repository = "https://github.com/VBlackJack/Heimdall-rs"
publish = false

[workspace.dependencies]
heimdall-core = { path = "crates/heimdall-core" }
heimdall-i18n = { path = "crates/heimdall-i18n" }
heimdall-ssh = { path = "crates/heimdall-ssh" }
heimdall-sftp = { path = "crates/heimdall-sftp" }
heimdall-term = { path = "crates/heimdall-term" }
heimdall-rdp = { path = "crates/heimdall-rdp" }
heimdall-twinshell = { path = "crates/heimdall-twinshell" }
heimdall-remote = { path = "crates/heimdall-remote" }

fluent-syntax = "0.12.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
iced = "0.14.0"
rust-embed = "8.12.0"
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
