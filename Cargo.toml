[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Patched third-party crates, see vendor/PATCHES.md: not ours to lint or format.
exclude = ["vendor/ironrdp-connector", "vendor/ironrdp-rdpdr", "vendor/ironrdp-session"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Julien Bombled"]
repository = "https://github.com/VBlackJack/Heimdall-rs"
publish = false

[workspace.dependencies]
heimdall-app = { path = "crates/heimdall-app" }
heimdall-core = { path = "crates/heimdall-core" }
heimdall-files = { path = "crates/heimdall-files" }
heimdall-keyring = { path = "crates/heimdall-keyring" }
heimdall-i18n = { path = "crates/heimdall-i18n" }
heimdall-ssh = { path = "crates/heimdall-ssh" }
heimdall-sftp = { path = "crates/heimdall-sftp" }
heimdall-term = { path = "crates/heimdall-term" }
heimdall-rdp = { path = "crates/heimdall-rdp" }
heimdall-twinshell = { path = "crates/heimdall-twinshell" }
heimdall-remote = { path = "crates/heimdall-remote" }
sealvault = { path = "crates/sealvault" }

# aes-gcm, argon2, getrandom: the sealvault format; all three already came in through russh.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
alacritty_terminal = { version = "0.26.0", default-features = false }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
data-encoding = "2.11.1"
directories = "6.0.0"
fluent-syntax = "0.12.0"
# keyring-core and its stores: saved passwords without a master password, in the system's own store (Windows
# Credential Manager, Secret Service on Linux); approved by Julien on 2026-09-27.
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = "1.0.1"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
# connector, session, graphics, input: the RDP client; TLS comes from tokio-rustls below.
# cliprdr: the clipboard channel, text only.
ironrdp = { version = "0.17.0", features = ["connector", "session", "graphics", "input", "dvc", "displaycontrol", "cliprdr", "rdpdr", "rdpsnd", "svc"] }
ironrdp-core = "0.2.1"
ironrdp-tokio = "0.10.0"
# cpal: an RDP server's sound played on this computer (WASAPI, ALSA, Core Audio).
cpal = "0.17.3"
iced = "0.14.0"
# iced_renderer: the renderer iced picks at run time, which iced keeps private.
iced_renderer = "0.14.0"
iced_test = "0.14.0"
# two-face: the syntaxes iced's highlighter colours with, to name the one a file is shown in.
two-face = { version = "0.4.5", default-features = false, features = ["syntect-default-fancy"] }
log = { version = "0.4.34", features = ["std"] }
# libunftp, unftp-sbe-fs: an FTP server in the Files tests only; ring, as the workspace.
libunftp = { version = "0.23.1", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4.0"
# rcgen: test certificates only.
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
# roxmltree: mRemoteNG and RDCMan files read, a DTD refused; already in the tree through the
# font stack.
roxmltree = "0.21.1"
# des: 3DES-CBC, offered only to a profile that allows legacy algorithms.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
rust-embed = "8.12.0"
# rustls-native-certs: the system's certificate store, for an FTPS certificate it trusts, as in
# the C#.
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# shlex: a local shell's argument line split as a POSIX shell does (Unix); already in the
# tree through the build of a dependency.
shlex = "2.0.1"
# suppaftp: FTP and explicit FTPS for the Files tab; tokio and rustls on ring, as the workspace.
suppaftp = { version = "12.1.1", default-features = false, features = ["tokio-rustls-ring"] }
# rfd: the system's save dialog for "Export Sessions", as the C# SaveFileDialog; on Linux
# through the desktop portal (zbus, already in the tree), no GTK.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# clipboard-win: the files copied in Explorer (CF_HDROP), read on Windows for "Paste from
# Explorer" and the RDP file copy; already in the tree through iced's clipboard.
clipboard-win = "5.4.1"
# windows-registry: PuTTY's saved sessions, read-only, on Windows; already in the tree.
windows-registry = "0.100.0"
# winsafe: the screens' working areas, listed on Windows for the window's place; safe
# wrappers, no dependency of its own.
winsafe = { version = "0.0.29", features = ["user"] }
tempfile = "3.27.0"
# des: VNC Authentication only, a DES challenge the protocol mandates.
des = "0.9.0"
# flate2: the zlib stream of VNC ZRLE, pure Rust backend.
flate2 = "1.1.10"
getrandom = "0.4.3"
# png: reading test snapshots back, pixel by pixel.
png = "0.18.1"
# polling: the ConPTY pipes of a local shell post to it (Windows).
polling = "3.11.0"
# rustix: hanging up and killing a local shell's process group (Unix).
rustix = { version = "1.1.5", features = ["process"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
# ring only: the workspace already carries it through russh, and no aws-lc build.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
# chrono: this computer's clock, for the date a note is written; already in the tree.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
toml = "1.1.6"
# unicode-normalization: accents folded out of the tree's search, as the C# FormD fold.
unicode-normalization = "0.1.25"
x509-cert = "0.3.0"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Argon2 at the vault's cost takes seconds unoptimised: tests stay fast, nothing else changes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# See vendor/PATCHES.md for what each patch changes and when it goes.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-rdpdr = { path = "vendor/ironrdp-rdpdr" }
ironrdp-session = { path = "vendor/ironrdp-session" }
