name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies of iced
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libfontconfig-dev openssh-sftp-server
          # The SFTP tests against OpenSSH's server must run here, not skip.
          echo "HEIMDALL_REQUIRE_SFTP_SERVER=1" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The executable of each change, so it can be run by hand on a machine without a
      # Rust toolchain; release profile, as shipped.
      - name: Build the application
        run: cargo build --release --locked -p heimdall-ui

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-rs-${{ runner.os }}
          path: |
            target/release/heimdall-rs
            target/release/heimdall-rs.exe
          if-no-files-found: error
          retention-days: 14

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
