name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A run takes 12 to 40 minutes; a stuck one is stopped long before the six hours the
    # runner allows.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies of iced
        if: runner.os == 'Linux'
        # A package mirror that stops answering held a run six hours.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          # libasound2-dev: only for the clippy run with the audio feature below; the default
          # Linux build links no sound library.
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libfontconfig-dev openssh-sftp-server libasound2-dev
          # The SFTP tests against OpenSSH's server must run here, not skip.
          echo "HEIMDALL_REQUIRE_SFTP_SERVER=1" >> "$GITHUB_ENV"

      # The runner is thrown away: the keyring's live tests may write to its store there.
      - name: Let the keyring's live tests write to the runner's store
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HEIMDALL_LIVE_KEYRING=1" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Sound is off by default on Linux, on by default on Windows: the Linux job also lints
      # the build that asks for it, so the code behind the feature keeps compiling here.
      - name: Clippy with the audio feature
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked --features heimdall-ui/audio -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The executable of each change, so it can be run by hand on a machine without a
      # Rust toolchain; release profile, as shipped.
      - name: Build the application
        run: cargo build --release --locked -p heimdall-ui

      - name: Upload the application
        uses: actions/upload-artifact@v7
        with:
          name: heimdall-rs-${{ runner.os }}
          path: |
            target/release/heimdall-rs
            target/release/heimdall-rs.exe
          if-no-files-found: error
          retention-days: 14

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
