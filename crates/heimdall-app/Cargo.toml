[package]
name = "heimdall-app"
description = "The application core of Heimdall: state, messages and effects, independent of any UI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
heimdall-core.workspace = true
heimdall-files.workspace = true
heimdall-keyring.workspace = true
heimdall-rdp.workspace = true
heimdall-remote.workspace = true
heimdall-sftp.workspace = true
heimdall-ssh.workspace = true
heimdall-term.workspace = true
heimdall-tls.workspace = true
sealvault.workspace = true
shlex.workspace = true
log.workspace = true
# The hash an edited file is compared by.
ring.workspace = true
regex.workspace = true
chrono.workspace = true
# process: the external credential provider's commands.
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
# The WinRM preflight's TLS handshake.
tokio-rustls.workspace = true
tokio-util.workspace = true
unicode-normalization.workspace = true
# The update check: its request to GitHub, the system's certificates it trusts, the release
# tag read from the answer.
ureq.workspace = true
rustls-native-certs.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# PuTTY's saved sessions, read from the registry.
windows-registry.workspace = true
# advapi, shell: a local shell run as administrator, started through ShellExecuteEx.
winsafe = { workspace = true, features = ["advapi", "shell"] }
# Security_Credentials_UI: Windows Hello asked before connecting.
windows.workspace = true

[dev-dependencies]
# An FTP server, and its certificate, the FTP driver's tests run against.
libunftp.workspace = true
rcgen = { workspace = true, features = ["pem"] }
# The in-process SSH server of the heimdall-ssh tests, run here for the server-side copy.
russh.workspace = true
tempfile.workspace = true
# macros, rt: async tests; process: the reference sftp-server.
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
unftp-sbe-fs.workspace = true

[lints]
workspace = true
