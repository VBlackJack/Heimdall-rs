[package]
name = "heimdall-app"
description = "The application core of Heimdall: state, messages and effects, independent of any UI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
heimdall-core.workspace = true
heimdall-files.workspace = true
heimdall-keyring.workspace = true
heimdall-rdp.workspace = true
heimdall-remote.workspace = true
heimdall-sftp.workspace = true
heimdall-ssh.workspace = true
heimdall-term.workspace = true
sealvault.workspace = true
shlex.workspace = true
log.workspace = true
# process: the external credential provider's commands.
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
# The WinRM preflight's TLS handshake.
tokio-rustls.workspace = true
tokio-util.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# PuTTY's saved sessions, read from the registry.
windows-registry.workspace = true

[dev-dependencies]
# An FTP server, and its certificate, the FTP driver's tests run against.
libunftp.workspace = true
rcgen = { workspace = true, features = ["pem"] }
# The exported document read back as JSON.
serde_json.workspace = true
# The in-process SSH server of the heimdall-ssh tests, run here for the server-side copy.
russh.workspace = true
tempfile.workspace = true
# macros, rt: async tests; process: the reference sftp-server.
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
unftp-sbe-fs.workspace = true

[lints]
workspace = true
