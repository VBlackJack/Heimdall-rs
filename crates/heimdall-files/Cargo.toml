[package]
name = "heimdall-files"
description = "Remote file systems behind one interface: what the Files tab asks of a server, whatever the protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
heimdall-sftp.workspace = true
ring.workspace = true
suppaftp.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
thiserror.workspace = true

[dev-dependencies]
heimdall-tls.workspace = true
# An FTP server the FTP tests run against, on disk.
libunftp.workspace = true
# The FTPS test server's certificate.
rcgen = { workspace = true, features = ["pem"] }
tempfile.workspace = true
unftp-sbe-fs.workspace = true
# process: OpenSSH's sftp-server run as a child in the tests.
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
