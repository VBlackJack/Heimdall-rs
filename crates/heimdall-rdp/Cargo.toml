[package]
name = "heimdall-rdp"
description = "RDP sessions on top of IronRDP, with servers trusted by their certificate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cpal.workspace = true
data-encoding.workspace = true
heimdall-core.workspace = true
ironrdp.workspace = true
ironrdp-core.workspace = true
ironrdp-tokio.workspace = true
log.workspace = true
ring.workspace = true
# The TCP keep-alives of a connection, as mstsc's `KeepAliveInterval`.
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The system's certificates, for strict server authentication.
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
x509-cert.workspace = true
zeroize.workspace = true

# fs: the size and free space of a shared drive (Unix).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# all: the keep-alive time and interval read back from a socket.
socket2 = { workspace = true, features = ["all"] }
tempfile.workspace = true
# rt-multi-thread, macros: async tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
