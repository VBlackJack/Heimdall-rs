[package]
name = "heimdall-rdp"
description = "RDP sessions on top of IronRDP, with servers trusted by their certificate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# audio: the server's sound played on this computer, through cpal. Off by default: on Linux
# cpal links the system's ALSA library (libasound, through alsa-sys); the application turns
# it on for Windows only, where cpal speaks to WASAPI through system DLLs alone.
audio = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
data-encoding.workspace = true
heimdall-core.workspace = true
ironrdp.workspace = true
ironrdp-core.workspace = true
ironrdp-tokio.workspace = true
log.workspace = true
# sealvault: certificate, public key and clipboard SHA-256 fingerprints. TLS itself runs on
# tokio-rustls's ring provider.
sealvault.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The system's certificates, for strict server authentication.
rustls-native-certs.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
x509-cert.workspace = true
zeroize.workspace = true

# fs: the size and free space of a shared drive (Unix).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
# rt-multi-thread, macros: async tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
