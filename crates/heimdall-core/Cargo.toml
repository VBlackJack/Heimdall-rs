[package]
name = "heimdall-core"
description = "Domain model shared by every Heimdall crate: server profiles, settings, paths and the credential vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
data-encoding.workspace = true
directories.workspace = true
fancy-regex.workspace = true
# sys_rng: the system's generator handed to the RSA key generation.
getrandom = { workspace = true, features = ["sys_rng"] }
hmac.workspace = true
md-5.workspace = true
pkcs8.workspace = true
# rcgen: the Certificate Generator's certificates, signed through ring; zeroize: its key
# pairs wiped, through the zeroize crate already in the tree.
rcgen = { workspace = true, features = ["zeroize"] }
regex.workspace = true
roxmltree.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
similar.workspace = true
ssh-key.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
# x509-cert: the certificates generated read back by the tests.
x509-cert.workspace = true

[target.'cfg(windows)'.dependencies]
# The current user's SID and the system folder, for the folders' access; shell: the known
# folders (local application data, Program Files, Windows), never read from the environment.
winsafe = { workspace = true, features = ["shell"] }

[lints]
workspace = true
