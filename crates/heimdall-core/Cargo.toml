[package]
name = "heimdall-core"
description = "Domain model shared by every Heimdall crate: server profiles, settings, paths and the credential vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
data-encoding.workspace = true
directories.workspace = true
fancy-regex.workspace = true
hmac.workspace = true
pkcs8.workspace = true
# rcgen: the Certificate Generator's certificates, signed through ring; zeroize: its key
# pairs wiped, through the zeroize crate already in the tree.
rcgen = { workspace = true, features = ["zeroize"] }
regex.workspace = true
roxmltree.workspace = true
# sealvault: the Hash, HMAC, JWT and TOTP tools' digests and MACs, the PIN's hash, and the
# generators' randomness.
sealvault.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
# rsa, ssh-key, x509-cert: the keys and certificates generated read back by the tests, a
# round-trip through the same crates that made them, as before the generation moved into
# sealvault.
rsa.workspace = true
ssh-key.workspace = true
x509-cert.workspace = true

[target.'cfg(windows)'.dependencies]
# The current user's SID and the system folder, for the folders' access; shell: the known
# folders (local application data, Program Files, Windows), never read from the environment.
winsafe = { workspace = true, features = ["shell"] }

[lints]
workspace = true
