[package]
name = "sealvault"
description = "Heimdall's cryptography behind one API (RustCrypto underneath), and a password-sealed file of named secrets: Argon2id, AES-256-GCM, every header byte authenticated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
# des: legacy::vnc_des only; zeroize wipes its key schedule on drop (cipher/zeroize is
# already in the tree through aes-gcm).
des = { workspace = true, features = ["zeroize"] }
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# derive: zeroize_derive is already in the tree, enabled by another crate.
zeroize = { workspace = true, features = ["derive"] }

[lints]
workspace = true
