[package]
name = "heimdall-titlebar"
description = "The window title bar drawn in the theme's colours, through the Windows desktop window manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
# The lints below read back and compared with the workspace's.
toml.workspace = true

# The workspace's lints, copied rather than inherited: a crate takes all of them or none, and
# this one needs unsafe code, which the workspace forbids. It is denied here instead, and
# allowed only in the module calling the window manager, each block of it explained.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
