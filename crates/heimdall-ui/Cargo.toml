[package]
name = "heimdall-ui"
description = "The Heimdall desktop application, built with iced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
# Not "heimdall": the C# Heimdall ships heimdall.exe, and both run side by side.
name = "heimdall-rs"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
heimdall-app.workspace = true
heimdall-core.workspace = true
heimdall-files.workspace = true
heimdall-rdp.workspace = true
heimdall-ssh.workspace = true
heimdall-term.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
# advanced: custom widgets; tokio: one runtime shared with the SSH client; fira-sans: the
# window's text font embedded, so it does not depend on the fonts of the machine.
# image-without-codecs: the RDP desktop is drawn from raw pixels, nothing is decoded.
iced = { workspace = true, features = ["advanced", "tokio", "fira-sans", "image-without-codecs", "highlighter"] }
iced_renderer = { workspace = true, features = ["wgpu"] }
log.workspace = true
rfd.workspace = true
rust-embed.workspace = true
# fs: the exported sessions written where the save dialog says.
tokio = { workspace = true, features = ["fs"] }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# The files copied in Explorer, which iced's clipboard does not read.
clipboard-win.workspace = true

[dev-dependencies]
# The fake SFTP server of the Files view tests.
heimdall-sftp.workspace = true
heimdall-i18n.workspace = true
iced_test.workspace = true
png.workspace = true
tempfile.workspace = true
# The stop of a post-connect sequence, in the tab tests.
tokio-util.workspace = true

[lints]
workspace = true
