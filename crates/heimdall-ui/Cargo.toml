[package]
name = "heimdall-ui"
description = "The Heimdall desktop application, built with iced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
heimdall-app.workspace = true
heimdall-core.workspace = true
heimdall-ssh.workspace = true
heimdall-term.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
# advanced: custom widgets; tokio: one runtime shared with the SSH client.
iced = { workspace = true, features = ["advanced", "tokio"] }
log.workspace = true
rust-embed.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
heimdall-i18n.workspace = true
iced_test.workspace = true
tempfile.workspace = true

[lints]
workspace = true
