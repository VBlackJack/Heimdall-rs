[advisories]
version = 2
yanked = "deny"
# Each ignore names one advisory, the path that brings it in, and why it cannot be
# removed from here. Re-check them when iced, russh or rsa is upgraded.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; pulled by metal, the macOS backend of wgpu, through iced; not built for Linux or Windows" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; pulled by fontdb and owned_ttf_parser through iced" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained; pulled by heapless 0.7 through iso7816, winscard and the scard feature of sspi, which ironrdp-connector enables; smart-card logon is not used" },
    # Decided by Julien Bombled on 2026-09-26. No fixed rsa release exists. Heimdall-rs only
    # signs with an RSA user key, locally, once per login; the only party observing that
    # timing is the server being logged into. Removing RSA would lock out servers that
    # accept only RSA keys.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack, no fix released; client-side signing once per login, observed only by the server logged into; accepted 2026-09-26" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# MPL-2.0 is file-level copyleft: it binds changes to that crate's own files, not the
# projects using it unmodified. Allowed crate by crate rather than for the whole graph.
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
